<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Teleprompter</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Teleprompter">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
  :root {
    --bg: #0b0b0d;
    --panel: #17181c;
    --border: #2a2b31;
    --text: #f2f2f2;
    --muted: #8a8b93;
    --accent: #4f9dff;
    --accent-dim: #2a4f80;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* ---------- Setup screen ---------- */
  #setup {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #setup.hidden { display: none; }
  .card {
    width: 100%;
    max-width: 720px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  .card h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 600;
  }
  .card p.sub {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 13px;
  }
  textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    background: #0e0e11;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-size: 15px;
    line-height: 1.6;
    font-family: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent-dim); border-color: var(--accent); }

  .controls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .field .row output {
    font-variant-numeric: tabular-nums;
    color: var(--text);
    font-size: 13px;
    min-width: 34px;
    text-align: right;
  }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  select {
    width: 100%;
    background: #0e0e11;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
  }

  .actions {
    margin-top: 24px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    border-radius: 8px;
    padding: 10px 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #08131f;
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.08); }

  /* ---------- Prompter screen ---------- */
  #prompter {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
  }
  #prompter.active { display: block; }

  #guide {
    position: absolute;
    left: 0; right: 0;
    top: 42%;
    height: 0;
    border-top: 2px solid rgba(79, 157, 255, 0.55);
    pointer-events: none;
    z-index: 5;
  }
  #guide.hidden { display: none; }

  #stage {
    position: absolute;
    inset: 0;
  }
  #stage.floating {
    position: fixed;
    inset: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(11, 11, 13, 0.94);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    resize: both;
    overflow: hidden;
    min-width: 280px;
    min-height: 160px;
  }
  #dragHandle {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 26px;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.06);
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.02em;
    cursor: move;
    z-index: 6;
    user-select: none;
    touch-action: none;
  }
  #stage.floating #dragHandle {
    display: flex;
  }
  #stage.floating #scrollArea {
    top: 26px;
  }

  #scrollArea {
    position: absolute;
    inset: 0;
    overflow-y: scroll;
    scrollbar-width: none;
    padding: 0 8vw;
  }
  #scrollArea::-webkit-scrollbar { display: none; }

  #textContent {
    padding-top: 42vh;
    padding-bottom: 80vh;
    white-space: pre-wrap;
    font-weight: 500;
    text-align: center;
  }
  #textContent.mirrored { transform: scaleX(-1); }
  #textContent.flipped-v { transform: scaleY(-1); }
  #textContent.mirrored.flipped-v { transform: scale(-1, -1); }

  #hud {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    z-index: 10;
    transition: opacity 0.3s;
  }
  #hud.hidden { opacity: 0; pointer-events: none; }
  #hud button {
    padding: 8px 14px;
    font-size: 13px;
    background: rgba(23,24,28,0.9);
  }
  #hud .spacer { flex: 1; max-width: 40px; }
  #hud .speed-label {
    color: var(--muted);
    font-size: 12px;
    padding: 0 4px;
  }

  #countdown {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 120px;
    font-weight: 700;
    color: var(--accent);
    z-index: 20;
    background: rgba(0,0,0,0.4);
  }
  #countdown.active { display: flex; }

  kbd {
    background: #0e0e11;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
  }
  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div id="setup">
  <div class="card">
    <h1>Teleprompter</h1>
    <p class="sub">Paste your script, tune the settings, then start.</p>

    <textarea id="scriptInput" placeholder="Paste or type your script here...">Welcome to the show.

This is your teleprompter. Paste your own script into this box, adjust the speed and font size below, then hit Start.

Use Space to play or pause, the Up and Down arrows to change speed on the fly, and Escape to come back here.

Good luck out there.</textarea>

    <div class="controls-grid">
      <div class="field">
        <label for="speed">Scroll speed</label>
        <div class="row">
          <input type="range" id="speed" min="1" max="10" step="0.5" value="3">
          <output id="speedOut">3</output>
        </div>
      </div>
      <div class="field">
        <label for="fontSize">Font size</label>
        <div class="row">
          <input type="range" id="fontSize" min="24" max="96" step="2" value="48">
          <output id="fontSizeOut">48</output>
        </div>
      </div>
      <div class="field">
        <label for="lineHeight">Line spacing</label>
        <div class="row">
          <input type="range" id="lineHeight" min="1.1" max="2.2" step="0.1" value="1.5">
          <output id="lineHeightOut">1.5</output>
        </div>
      </div>
      <div class="field">
        <label for="textWidth">Text width</label>
        <div class="row">
          <input type="range" id="textWidth" min="40" max="100" step="5" value="80">
          <output id="textWidthOut">80%</output>
        </div>
      </div>
      <div class="field">
        <label>Mirror mode</label>
        <div class="toggle-row">
          <input type="checkbox" id="mirrorH">
          <label for="mirrorH" style="margin:0;">Flip horizontal (glass rig)</label>
        </div>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <div class="toggle-row">
          <input type="checkbox" id="showGuide" checked>
          <label for="showGuide" style="margin:0;">Show reading guide line</label>
        </div>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <div class="toggle-row">
          <input type="checkbox" id="floatMode">
          <label for="floatMode" style="margin:0;">Floating text box (drag &amp; resize)</label>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="startBtn" class="primary">Start Teleprompter</button>
    </div>
    <p class="hint">Once started: <kbd>Space</kbd> play/pause &nbsp; <kbd>&uarr;</kbd>/<kbd>&darr;</kbd> speed &nbsp; <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> font size &nbsp; <kbd>Esc</kbd> exit &nbsp; <kbd>F</kbd> fullscreen</p>
  </div>
</div>

<div id="prompter">
  <div id="stage">
    <div id="dragHandle">&#8942;&#8942;&#8942; drag to move &middot; resize from the corner</div>
    <div id="guide"></div>
    <div id="scrollArea">
      <div id="textContent"></div>
    </div>
  </div>
  <div id="countdown"></div>
  <div id="hud">
    <button id="exitBtn" title="Back to editor (Esc)">&larr; Edit</button>
    <button id="speedDownBtn" title="Slower (Down arrow)">&minus; Speed</button>
    <span class="speed-label" id="hudSpeedLabel">3.0</span>
    <button id="speedUpBtn" title="Faster (Up arrow)">+ Speed</button>
    <span class="spacer"></span>
    <button id="playPauseBtn" title="Play/Pause (Space)">Play</button>
    <span class="spacer"></span>
    <button id="fontDownBtn" title="Smaller (Left arrow)">A&minus;</button>
    <button id="fontUpBtn" title="Larger (Right arrow)">A+</button>
    <button id="mirrorBtn" title="Toggle mirror">Mirror</button>
    <button id="floatBtn" title="Toggle floating text box">Float</button>
    <button id="fullscreenBtn" title="Fullscreen (F)">Fullscreen</button>
  </div>
</div>

<script>
(function () {
  const setup = document.getElementById('setup');
  const prompter = document.getElementById('prompter');
  const scriptInput = document.getElementById('scriptInput');
  const textContent = document.getElementById('textContent');
  const scrollArea = document.getElementById('scrollArea');
  const guide = document.getElementById('guide');
  const hud = document.getElementById('hud');
  const countdownEl = document.getElementById('countdown');
  const stageEl = document.getElementById('stage');
  const dragHandleEl = document.getElementById('dragHandle');

  const speedInput = document.getElementById('speed');
  const fontSizeInput = document.getElementById('fontSize');
  const lineHeightInput = document.getElementById('lineHeight');
  const textWidthInput = document.getElementById('textWidth');
  const mirrorHInput = document.getElementById('mirrorH');
  const showGuideInput = document.getElementById('showGuide');

  const speedOut = document.getElementById('speedOut');
  const fontSizeOut = document.getElementById('fontSizeOut');
  const lineHeightOut = document.getElementById('lineHeightOut');
  const textWidthOut = document.getElementById('textWidthOut');

  const startBtn = document.getElementById('startBtn');
  const exitBtn = document.getElementById('exitBtn');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const speedUpBtn = document.getElementById('speedUpBtn');
  const speedDownBtn = document.getElementById('speedDownBtn');
  const fontUpBtn = document.getElementById('fontUpBtn');
  const fontDownBtn = document.getElementById('fontDownBtn');
  const mirrorBtn = document.getElementById('mirrorBtn');
  const floatModeInput = document.getElementById('floatMode');
  const floatBtn = document.getElementById('floatBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const hudSpeedLabel = document.getElementById('hudSpeedLabel');

  let state = {
    speed: parseFloat(speedInput.value),
    fontSize: parseInt(fontSizeInput.value, 10),
    lineHeight: parseFloat(lineHeightInput.value),
    textWidth: parseInt(textWidthInput.value, 10),
    mirrorH: false,
    mirrorV: false,
    showGuide: true,
    floating: false,
    playing: false
  };

  let floatRect = { width: 640, height: 360, top: null, left: null };
  let dragState = null;

  let rafId = null;
  let lastTs = null;
  let hudHideTimer = null;

  function syncLiveLabels() {
    speedOut.textContent = state.speed.toFixed(1);
    fontSizeOut.textContent = state.fontSize;
    lineHeightOut.textContent = state.lineHeight.toFixed(1);
    textWidthOut.textContent = state.textWidth + '%';
    hudSpeedLabel.textContent = state.speed.toFixed(1);
  }

  speedInput.addEventListener('input', () => {
    state.speed = parseFloat(speedInput.value);
    syncLiveLabels();
  });
  fontSizeInput.addEventListener('input', () => {
    state.fontSize = parseInt(fontSizeInput.value, 10);
    applyStyles();
  });
  lineHeightInput.addEventListener('input', () => {
    state.lineHeight = parseFloat(lineHeightInput.value);
    applyStyles();
  });
  textWidthInput.addEventListener('input', () => {
    state.textWidth = parseInt(textWidthInput.value, 10);
    applyStyles();
  });
  mirrorHInput.addEventListener('change', () => {
    state.mirrorH = mirrorHInput.checked;
    applyStyles();
  });
  showGuideInput.addEventListener('change', () => {
    state.showGuide = showGuideInput.checked;
    applyStyles();
  });

  function applyStyles() {
    textContent.style.fontSize = state.fontSize + 'px';
    textContent.style.lineHeight = state.lineHeight;
    scrollArea.style.padding = '0 ' + ((100 - state.textWidth) / 2) + '%';
    textContent.classList.toggle('mirrored', state.mirrorH);
    textContent.classList.toggle('flipped-v', state.mirrorV);
    guide.classList.toggle('hidden', !state.showGuide);
    syncLiveLabels();
  }

  function loadScript() {
    textContent.textContent = scriptInput.value || '';
  }

  function centerFloatRectIfNeeded() {
    if (floatRect.top === null || floatRect.left === null) {
      floatRect.top = Math.max(20, (window.innerHeight - floatRect.height) / 2);
      floatRect.left = Math.max(20, (window.innerWidth - floatRect.width) / 2);
    }
  }

  function clampFloatRect() {
    const maxLeft = Math.max(0, window.innerWidth - 100);
    const maxTop = Math.max(0, window.innerHeight - 60);
    floatRect.left = Math.min(Math.max(0, floatRect.left), maxLeft);
    floatRect.top = Math.min(Math.max(0, floatRect.top), maxTop);
  }

  function applyFloating() {
    stageEl.classList.toggle('floating', state.floating);
    if (state.floating) {
      centerFloatRectIfNeeded();
      clampFloatRect();
      stageEl.style.width = floatRect.width + 'px';
      stageEl.style.height = floatRect.height + 'px';
      stageEl.style.top = floatRect.top + 'px';
      stageEl.style.left = floatRect.left + 'px';
    } else {
      stageEl.style.width = '';
      stageEl.style.height = '';
      stageEl.style.top = '';
      stageEl.style.left = '';
    }
  }

  const stageResizeObserver = new ResizeObserver((entries) => {
    if (!state.floating) return;
    const entry = entries[0];
    floatRect.width = Math.round(entry.contentRect.width);
    floatRect.height = Math.round(entry.contentRect.height);
  });
  stageResizeObserver.observe(stageEl);

  dragHandleEl.addEventListener('pointerdown', (e) => {
    if (!state.floating) return;
    dragState = {
      startX: e.clientX,
      startY: e.clientY,
      startLeft: floatRect.left,
      startTop: floatRect.top
    };
    dragHandleEl.setPointerCapture(e.pointerId);
  });
  dragHandleEl.addEventListener('pointermove', (e) => {
    if (!dragState) return;
    floatRect.left = dragState.startLeft + (e.clientX - dragState.startX);
    floatRect.top = dragState.startTop + (e.clientY - dragState.startY);
    clampFloatRect();
    stageEl.style.left = floatRect.left + 'px';
    stageEl.style.top = floatRect.top + 'px';
  });
  function endDrag(e) {
    if (dragState) {
      dragHandleEl.releasePointerCapture(e.pointerId);
      dragState = null;
    }
  }
  dragHandleEl.addEventListener('pointerup', endDrag);
  dragHandleEl.addEventListener('pointercancel', endDrag);

  window.addEventListener('resize', () => {
    if (!state.floating) return;
    clampFloatRect();
    stageEl.style.left = floatRect.left + 'px';
    stageEl.style.top = floatRect.top + 'px';
  });

  floatModeInput.addEventListener('change', () => {
    state.floating = floatModeInput.checked;
    applyFloating();
  });
  floatBtn.addEventListener('click', () => {
    state.floating = !state.floating;
    floatModeInput.checked = state.floating;
    applyFloating();
    showHud();
  });

  function startPrompter() {
    loadScript();
    applyStyles();
    applyFloating();
    setup.classList.add('hidden');
    prompter.classList.add('active');
    scrollArea.scrollTop = 0;
    runCountdown(3, () => {
      state.playing = true;
      updatePlayPauseLabel();
      lastTs = null;
      rafId = requestAnimationFrame(tick);
    });
    scheduleHudHide();
  }

  function exitPrompter() {
    state.playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    prompter.classList.remove('active');
    setup.classList.remove('hidden');
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
  }

  function runCountdown(seconds, done) {
    let n = seconds;
    countdownEl.textContent = n;
    countdownEl.classList.add('active');
    const iv = setInterval(() => {
      n -= 1;
      if (n <= 0) {
        clearInterval(iv);
        countdownEl.classList.remove('active');
        done();
      } else {
        countdownEl.textContent = n;
      }
    }, 1000);
  }

  function tick(ts) {
    if (!state.playing) return;
    if (lastTs === null) lastTs = ts;
    const dt = (ts - lastTs) / 1000;
    lastTs = ts;
    const pixelsPerSecond = state.speed * 18;
    scrollArea.scrollTop += pixelsPerSecond * dt;

    const atBottom = scrollArea.scrollTop + scrollArea.clientHeight >= scrollArea.scrollHeight - 2;
    if (atBottom) {
      state.playing = false;
      updatePlayPauseLabel();
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  function togglePlay() {
    state.playing = !state.playing;
    updatePlayPauseLabel();
    if (state.playing) {
      lastTs = null;
      rafId = requestAnimationFrame(tick);
    } else if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
    showHud();
  }

  function updatePlayPauseLabel() {
    playPauseBtn.textContent = state.playing ? 'Pause' : 'Play';
  }

  function adjustSpeed(delta) {
    state.speed = Math.min(10, Math.max(1, Math.round((state.speed + delta) * 2) / 2));
    speedInput.value = state.speed;
    syncLiveLabels();
    showHud();
  }

  function adjustFont(delta) {
    state.fontSize = Math.min(96, Math.max(24, state.fontSize + delta));
    fontSizeInput.value = state.fontSize;
    applyStyles();
    showHud();
  }

  function showHud() {
    hud.classList.remove('hidden');
    scheduleHudHide();
  }

  function scheduleHudHide() {
    if (hudHideTimer) clearTimeout(hudHideTimer);
    hudHideTimer = setTimeout(() => {
      if (state.playing) hud.classList.add('hidden');
    }, 2500);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      prompter.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  startBtn.addEventListener('click', startPrompter);
  exitBtn.addEventListener('click', exitPrompter);
  playPauseBtn.addEventListener('click', togglePlay);
  speedUpBtn.addEventListener('click', () => adjustSpeed(0.5));
  speedDownBtn.addEventListener('click', () => adjustSpeed(-0.5));
  fontUpBtn.addEventListener('click', () => adjustFont(4));
  fontDownBtn.addEventListener('click', () => adjustFont(-4));
  mirrorBtn.addEventListener('click', () => {
    state.mirrorH = !state.mirrorH;
    mirrorHInput.checked = state.mirrorH;
    applyStyles();
    showHud();
  });
  fullscreenBtn.addEventListener('click', toggleFullscreen);

  scrollArea.addEventListener('mousemove', showHud);
  scrollArea.addEventListener('click', showHud);

  document.addEventListener('keydown', (e) => {
    if (!prompter.classList.contains('active')) return;
    switch (e.code) {
      case 'Space':
        e.preventDefault();
        togglePlay();
        break;
      case 'ArrowUp':
        e.preventDefault();
        adjustSpeed(0.5);
        break;
      case 'ArrowDown':
        e.preventDefault();
        adjustSpeed(-0.5);
        break;
      case 'ArrowRight':
        e.preventDefault();
        adjustFont(4);
        break;
      case 'ArrowLeft':
        e.preventDefault();
        adjustFont(-4);
        break;
      case 'Escape':
        exitPrompter();
        break;
      case 'KeyF':
        toggleFullscreen();
        break;
    }
  });

  syncLiveLabels();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
